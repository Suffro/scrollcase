name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: package surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run types:check
      - run: npm pack --dry-run
      - run: npm audit --omit=dev

  python-consumer:
    name: python consumer (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install -e './python[test]'
      - run: python -m unittest discover -s tests -t .
        working-directory: python
      - run: mypy src
        if: matrix.python == '3.10'
        working-directory: python
      - run: python scripts/sync_schemas.py --check
        working-directory: python
      - run: python -m build
        if: matrix.python == '3.14'
        working-directory: python
      - run: python scripts/check_distribution.py dist/*
        if: matrix.python == '3.14'
        working-directory: python
      - run: |
          python -m venv /tmp/scrollcase-consumer-clean
          /tmp/scrollcase-consumer-clean/bin/python -m pip install python/dist/*.whl
          /tmp/scrollcase-consumer-clean/bin/python -c "from scrollcase_consumer import run_box; assert callable(run_box)"
        if: matrix.python == '3.14'

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
