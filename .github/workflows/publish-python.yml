name: Publish Python consumer

on:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Python distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install -e './python[test]'
      - run: python scripts/check_release_version.py "$GITHUB_REF_NAME"
        working-directory: python
      - run: python -m unittest discover -s tests -t .
        working-directory: python
      - run: mypy src
        working-directory: python
      - run: python scripts/sync_schemas.py --check
        working-directory: python
      - run: python -m build
        working-directory: python
      - run: python scripts/check_distribution.py dist/*
        working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: python/dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/scrollcase-consumer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
