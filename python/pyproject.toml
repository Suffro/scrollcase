[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scrollcase-consumer"
version = "0.1.0"
description = "Verify, prepare, and run caller-supplied local Scrollcase boxes."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
  "scrollcase",
  "ed25519",
  "scientific-computing",
  "reproducible-environments",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=42,<47",
  "jsonschema>=4.21,<5",
]

[project.urls]
Homepage = "https://scrollcase.dev"
Repository = "https://github.com/suffro/scrollcase"
Issues = "https://github.com/suffro/scrollcase/issues"

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "tomli>=2; python_version < '3.11'",
  "types-jsonschema>=4.21",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scrollcase_consumer = ["py.typed", "schemas/*.json"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
